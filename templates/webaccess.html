{% extends "base.html" %}
{% set active_page = 'webaccess' %}

{% block title %}Web Access | OTP-Tool{% endblock %}

{% block page %}
<div class="page">
  <div class="page-topbar" id="webaccess-topbar">
    <div class="topbar-search">
      <span class="ico" data-icon="search"></span>
      <input type="text" id="webaccess-search" placeholder="Search companies…" autocomplete="off">
    </div>
    <div class="topbar-note">{{ companies|length }} companies</div>
  </div>

  <div class="page-scroll">
    <div style="max-width:800px;margin:0 auto">
      <div class="table-panel" id="webaccess-list" style="display:none"></div>
      <div class="empty-state" id="webaccess-empty" style="display:none">
        <span class="ico" data-icon="search"></span>
        <div class="txt">No companies match your search</div>
      </div>
    </div>
    <div id="webaccess-empty-vault" style="display:none"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
  const A = window.App;
  const COMPANIES = [
    {% for c in companies %}
    { id: {{ c[0] }}, name: {{ c[1]|tojson }}, enabled: {{ (c[2]|int if c[2] is not none else 0)|tojson }} }{{ "," if not loop.last }}
    {% endfor %}
  ];

  let search = "";
  const list = document.getElementById("webaccess-list");
  const empty = document.getElementById("webaccess-empty");
  const emptyVault = document.getElementById("webaccess-empty-vault");
  const topbar = document.getElementById("webaccess-topbar");
  const pageScroll = emptyVault.closest(".page-scroll");

  function render() {
    const hasAny = COMPANIES.length > 0;

    A.emptyBgStop();
    topbar.style.display = hasAny ? "" : "none";
    pageScroll.classList.toggle("no-anim", !hasAny);

    if (!hasAny) {
      list.style.display = "none";
      empty.style.display = "none";
      emptyVault.style.display = "";
      emptyVault.innerHTML = A.emptyVaultHTML({
        icon: "globe",
        title: "No companies yet",
        desc: "Web access lets a company log in with its own credentials. Add a company first, then enable access here.",
        actions: [{ label: "Go to Companies", icon: "building", act: "companies", primary: true }],
      });
      A.emptyBgStart(emptyVault.querySelector(".empty-vault-bg"));
      return;
    }
    emptyVault.style.display = "none";

    const q = search.trim().toLowerCase();
    const filtered = q ? COMPANIES.filter(c => c.name.toLowerCase().includes(q)) : COMPANIES;
    list.style.display = filtered.length ? "" : "none";
    empty.style.display = filtered.length ? "none" : "flex";
    list.innerHTML = filtered.map(c =>
      '<div class="table-row" style="display:flex;align-items:center;gap:12px">' +
      '<div class="row-title" style="flex:1;min-width:0">' + A.escapeHtml(c.name) + "</div>" +
      '<div class="row-dim" style="font-size:12px;margin-right:8px">' + (c.enabled ? "Enabled" : "Disabled") + "</div>" +
      '<button class="switch' + (c.enabled ? " on" : "") + '" data-toggle="' + c.id + '" type="button"><span class="knob"></span></button>' +
      "</div>"
    ).join("");
  }

  list.addEventListener("click", async e => {
    const btn = e.target.closest("[data-toggle]");
    if (!btn) return;
    const c = COMPANIES.find(x => x.id === +btn.getAttribute("data-toggle"));
    try {
      const res = await A.fetchJSON("/api/toggle-web-access", {
        method: "POST",
        body: { company_id: c.id, enabled: !c.enabled },
      });
      c.enabled = res.enabled ? 1 : 0;
      A.toast((c.enabled ? "Enabled" : "Disabled") + " web access for " + c.name);
      render();
    } catch (err) { A.toast(err.message, "error"); }
  });

  document.getElementById("webaccess-search").addEventListener("input", e => { search = e.target.value; render(); });
  A.attachAutocomplete(document.getElementById("webaccess-search"), () => COMPANIES.map(c => c.name));

  emptyVault.addEventListener("click", e => {
    if (e.target.closest('[data-empty-act="companies"]')) window.location.href = "/companies";
  });
  if (A.onPageLeave) A.onPageLeave(() => A.emptyBgStop());

  render();
})();
</script>
{% endblock %}
